services:
  clickhouse:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION:-25.8}
    environment:
      # Make the `default` user available over the network (insecure; test-only).
      - CLICKHOUSE_SKIP_USER_SETUP=1
    ports:
      - "9000:9000"   # native
      - "8123:8123"   # http
    volumes:
      # Mount files one by one: mounting the whole config.d hides the image's
      # docker_related_config.xml (listen_host) and breaks the published ports.
      - ./clickhouse-server/config.d/cluster-keeper.xml:/etc/clickhouse-server/config.d/cluster-keeper.xml:ro
      - ./clickhouse-server/config.d/optional-logs.xml:/etc/clickhouse-server/config.d/optional-logs.xml:ro
      - ./clickhouse-server/config.d/memory-test.xml:/etc/clickhouse-server/config.d/memory-test.xml:ro
      - ./clickhouse-server/config.d/test-suite-logs.xml:/etc/clickhouse-server/config.d/test-suite-logs.xml:ro
      - ./clickhouse-server/users.d/default-no-password.xml:/etc/clickhouse-server/users.d/default-no-password.xml:ro
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse-data: {}

